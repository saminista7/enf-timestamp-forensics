[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enf-lmin"
version = "0.1.0"
description = "Grid-dependent minimum recording length for forensic ENF timestamp matching"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Ahnaf Samin" }]

[tool.hatch.build.targets.wheel]
packages = ["src/enf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running (checksum verification, Hua reproduction, full sweeps)",
    "needs_data: requires downloaded raw data under data/raw/",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501"]  # black handles line length

[tool.ruff.isort]
known-first-party = ["enf"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.jupytext]
formats = "ipynb,py:percent"
