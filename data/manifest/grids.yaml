# Site metadata for the open grid frequency recordings. Hand written, because none of this
# can be derived from the files themselves.
#
# Only what the data does not say: which synchronous area a site sits in, its timezone, and
# any published control deadband. Everything measurable is computed from the files, since a
# hand typed number that disagrees with the data is worse than no number at all.
#
# `nominal_hz` is a cross check rather than an input. The csv column is named f50_* or f60_*
# and the loader asserts the file agrees with what is declared here.
#
# `area` matters when counting independent observations. Nine of these sites are the same
# Continental European grid, so they are nine sensors on one thing, not nine things.
#
# Sources for the area and deadband facts: Jumar et al. arXiv:2006.01771, and Rydin Gorjao
# et al. Nature Communications 11:6362 (2020). Anything uncertain is left out rather than
# guessed at.

